<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratik AI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

header{
    background:#1f1f1f;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

#chat{
    height:70vh;
    overflow-y:auto;
    padding:15px;
}

.message{
    padding:10px;
    margin:10px 0;
    border-radius:10px;
}

.user{
    background:#2d6cdf;
}

.ai{
    background:#333;
}

.controls{
    position:fixed;
    bottom:0;
    width:100%;
    background:#1f1f1f;
    padding:15px;
    text-align:center;
}

button{
    padding:12px 20px;
    font-size:18px;
    border:none;
    border-radius:10px;
}
</style>
</head>

<body>

<header>🤖 Pratik AI</header>

<div id="chat">
    <div class="message ai">
        Namaste! I am Pratik AI.
    </div>
</div>

<div class="controls">
    <button onclick="startListening()">🎤 Speak</button>
</div>

<script>

function addMessage(text,type){
    let chat=document.getElementById("chat");

    let div=document.createElement("div");
    div.className="message "+type;
    div.innerText=text;

    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}

function speak(text){
    let speech=new SpeechSynthesisUtterance(text);
    speech.lang="en-US";
    speechSynthesis.speak(speech);
}

function startListening(){
alert("Button kaam kar raha hai");

    if(!('webkitSpeechRecognition' in window)){
        alert("Speech Recognition not supported");
        return;
    }

    let recognition=new webkitSpeechRecognition();

    recognition.lang="en-IN";
    recognition.start();

    recognition.onresult=function(event){

        let text=event.results[0][0].transcript;

        addMessage(text,"user");

        let reply="You said: " + text;

        addMessage(reply,"ai");

        speak(reply);
    };
}

</script>

</body>
</html>
